name: Publier le site (GitHub Pages)

# Recopie le contenu du dossier docs/ sur la branche « gh-pages », que
# GitHub Pages sert ensuite à l'adresse https://amiral25.github.io/ia-5/
#
# Pourquoi cette méthode plutôt que l'action officielle « deploy-pages » ?
# Créer un site Pages par l'API exige les droits d'administration du dépôt,
# qu'un workflow n'obtient jamais (erreur « Resource not accessible by
# integration »). Écrire dans une branche ne demande que « contents: write ».

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-site
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Le sitemap était tenu à la main et ses dates avaient dérivé : l'une
      # d'elles précédait même la création de la page qu'elle datait. Il est
      # désormais recalculé à chaque publication, à partir de l'historique git.
      - name: Engendrer le sitemap
        run: python3 outils/sitemap.py

      # Le CSS et le JS sont commentés en long et en large, ce qui est une
      # bonne chose dans le dépôt et un poids mort sur le réseau. La version
      # publiée est réduite ; les sources restent intactes. En cas d'échec de
      # l'outil, on publie les fichiers d'origine plutôt que rien.
      - name: Réduire le CSS et le JS
        continue-on-error: true
        run: |
          set -u
          avant=$(wc -c < docs/style.css)$'\t'$(wc -c < docs/script.js)
          npx --yes esbuild@0.24.0 docs/style.css --minify --outfile=/tmp/style.min.css || true
          npx --yes esbuild@0.24.0 docs/script.js --minify --outfile=/tmp/script.min.js || true
          for p in style.css:/tmp/style.min.css script.js:/tmp/script.min.js; do
            src=${p%%:*}; min=${p#*:}
            if [ -s "$min" ] && [ "$(wc -c < "$min")" -lt "$(wc -c < "docs/$src")" ]; then
              cp "$min" "docs/$src"
              echo "$src réduit à $(wc -c < "docs/$src") octets"
            else
              echo "$src laissé tel quel"
            fi
          done
          echo "avant (css, js) : $avant"

      - name: Recopier docs/ sur la branche gh-pages
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/site
          cp -r docs /tmp/site
          touch /tmp/site/.nojekyll

          git checkout --orphan publication-temporaire
          git rm -rf . > /dev/null
          cp -r /tmp/site/. .

          git add -A
          git commit -m "Publication du site (source : ${GITHUB_SHA})"
          git push --force origin HEAD:gh-pages

      # Prévient Bing (et donc ChatGPT et Copilot, qui puisent dans son index)
      # qu'une page a changé, sans attendre son prochain passage. Google ne
      # participe pas à ce protocole : lui passe toujours par Search Console.
      # Une panne du service ne doit jamais faire échouer la publication.
      - name: Signaler les pages à IndexNow
        continue-on-error: true
        run: |
          set -u
          # L'étape précédente a remplacé l'arborescence par celle de gh-pages ;
          # la copie intacte du site reste dans /tmp/site.
          python3 - <<'PY' > /tmp/indexnow.json
          import json, re
          cle = '5f635c1f34de81654e24c32d13f3fe1e'
          xml = open('/tmp/site/sitemap.xml', encoding='utf-8').read()
          print(json.dumps({
            'host': 'calculatrice-duree.fr',
            'key': cle,
            'keyLocation': f'https://calculatrice-duree.fr/{cle}.txt',
            'urlList': re.findall(r'<loc>([^<]+)</loc>', xml),
          }))
          PY

          CODE=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
                 --max-time 30 \
                 -H 'Content-Type: application/json; charset=utf-8' \
                 --data-binary @/tmp/indexnow.json \
                 https://api.indexnow.org/indexnow || echo 000)

          echo "IndexNow a répondu $CODE"
          cat /tmp/indexnow.out || true
          # 200 et 202 valent acceptation ; le reste est signalé sans bloquer.
          case "$CODE" in 200|202) echo "✅ pages signalées" ;; *) echo "⚠️ signalement ignoré" ;; esac

      - name: Récapitulatif
        run: |
          echo "### ✅ Site publié" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Adresse : https://amiral25.github.io/ia-5/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Si la page renvoie une erreur 404, ouvrez une seule fois" >> "$GITHUB_STEP_SUMMARY"
          echo "**Settings → Pages** et choisissez la branche \`gh-pages\` (dossier \`/ (root)\`)." >> "$GITHUB_STEP_SUMMARY"

name: Publier le site (GitHub Pages)

# Recopie le contenu du dossier docs/ sur la branche « gh-pages », que
# GitHub Pages sert ensuite à l'adresse https://amiral25.github.io/ia-5/
#
# Pourquoi cette méthode plutôt que l'action officielle « deploy-pages » ?
# Créer un site Pages par l'API exige les droits d'administration du dépôt,
# qu'un workflow n'obtient jamais (erreur « Resource not accessible by
# integration »). Écrire dans une branche ne demande que « contents: write ».

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-site
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Recopier docs/ sur la branche gh-pages
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/site
          cp -r docs /tmp/site
          touch /tmp/site/.nojekyll

          git checkout --orphan publication-temporaire
          git rm -rf . > /dev/null
          cp -r /tmp/site/. .

          git add -A
          git commit -m "Publication du site (source : ${GITHUB_SHA})"
          git push --force origin HEAD:gh-pages

      - name: Récapitulatif
        run: |
          echo "### ✅ Site publié" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Adresse : https://amiral25.github.io/ia-5/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Si la page renvoie une erreur 404, ouvrez une seule fois" >> "$GITHUB_STEP_SUMMARY"
          echo "**Settings → Pages** et choisissez la branche \`gh-pages\` (dossier \`/ (root)\`)." >> "$GITHUB_STEP_SUMMARY"
